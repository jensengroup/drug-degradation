[project]
name = "rxnnet"
version = "0.1.0"
description = "Reaction network exploration"
requires-python = ">=3.10"
dependencies = [
    "numpy<2.0",
    "pandas",
    "tqdm",
    "rdkit",
    "joblib",
    "pymsym",
    "watchdog",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rxnnet"]

[tool.hatch.metadata]
allow-direct-references = true
